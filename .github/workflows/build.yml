name: Build

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/build.yml"
  push:
    branches: [main]
    paths:
      - "app/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore app/CloudForge.Api/CloudForge.Api.csproj
      - run: dotnet build app/CloudForge.Api/CloudForge.Api.csproj -c Release --no-restore
